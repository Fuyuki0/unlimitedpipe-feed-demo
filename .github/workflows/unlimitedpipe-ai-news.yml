# Generated by `unlimited publish`: runs the ai-news pipeline on a schedule, keeps its state in
# the repository, and publishes public/ with GitHub Pages.
name: "UnlimitedPipe: ai-news"

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unlimitedpipe-ai-news
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "unlimitedpipe==0.1.0"
      - name: Run the pipeline
        env:
          UNLIMITEDPIPE_STATE_DIR: .unlimitedpipe/state
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          unlimited run "feeds/ai-news.yml"
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::warning::some sources failed; publishing the rest"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: Save outputs and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public"
          if [ -d ".unlimitedpipe/state" ]; then git add ".unlimitedpipe/state"; fi
          git diff --cached --quiet || git commit -m "Update ai-news"
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "public"

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
