# Generated by `unlimited publish`: runs 26 pipeline(s) on a schedule, keeps
# their state in the repository, and publishes public/ with GitHub Pages.
name: "UnlimitedPipe: feeds"

on:
  schedule:
    - cron: "54 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: unlimitedpipe-feeds
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "unlimitedpipe==0.3.2"
      - name: Run the pipelines
        env:
          UNLIMITEDPIPE_STATE_DIR: .unlimitedpipe/state
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          ok=0
          for pipeline in "feeds/ai-labs.yml" "feeds/ai-news.yml" "feeds/ai-papers.yml" "feeds/ai-releases.yml" "feeds/arxiv-llm.yml" "feeds/climate-news.yml" "feeds/cloud-status.yml" "feeds/crypto-news.yml" "feeds/dev-releases.yml" "feeds/earthquakes.yml" "feeds/exploited-vulnerabilities.yml" "feeds/hn-top.yml" "feeds/lobbying-big-spenders.yml" "feeds/nasa-image.yml" "feeds/python-news.yml" "feeds/rust-news.yml" "feeds/sanctions-actions.yml" "feeds/sec-company-events.yml" "feeds/sec-cyber-incidents.yml" "feeds/sec-ipo-filings.yml" "feeds/security-news.yml" "feeds/show-hn.yml" "feeds/space-launches.yml" "feeds/thailand-news.yml" "feeds/us-new-rules.yml" "feeds/world-headlines.yml"; do
            set +e
            unlimited run "$pipeline"
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              ok=$((ok + 1))
            elif [ "$code" -eq 1 ]; then
              ok=$((ok + 1))
              echo "::warning::$pipeline: some sources failed; publishing the rest"
            else
              echo "::error::$pipeline failed (exit $code); publishing the others"
            fi
          done
          [ "$ok" -gt 0 ]  # fail only when nothing could run
      - name: Save outputs and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "public"
          if [ -d ".unlimitedpipe/state" ]; then git add ".unlimitedpipe/state"; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update feeds"
          for attempt in 1 2 3; do
            git pull --rebase --autostash --quiet && git push --quiet && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "public"

  deploy:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
